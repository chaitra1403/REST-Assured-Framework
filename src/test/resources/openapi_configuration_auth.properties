# =============================================================================
# Authentication Configuration File
# =============================================================================
# This file contains authentication credentials and API configuration settings
# for the UnifiedAuthHandler.
#
# Environment Variable Override:
# All properties can be overridden by environment variables with the AUTH_ prefix.
# Example: AUTH_bearerAuth_token overrides bearerAuth_token property
# =============================================================================

# -----------------------------------------------------------------------------
# API Configuration
# -----------------------------------------------------------------------------

# Base URL for API requests
# Environment variable override: AUTH_api_baseUrl
api_baseUrl=<your-api-base-url>

# Environment name (e.g., dev, staging, prod)
# Environment variable override: AUTH_api_environment
api_environment=dev

# -----------------------------------------------------------------------------
# Authentication - Bearer Auth (JWT)
# -----------------------------------------------------------------------------
# HTTP Bearer authentication using JWT tokens
# Used for endpoints requiring bearerAuth security scheme
# Header format: Authorization: Bearer {token}

# JWT Bearer token for authentication
# Environment variable override: AUTH_bearerAuth_token
bearerAuth_token=<your-jwt-bearer-token>
